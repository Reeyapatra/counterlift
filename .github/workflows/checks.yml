name: scientific-and-ui-checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: counterlift demo --out runs/demo --bootstrap 100
      - run: python scripts/check_app.py
      - run: counterlift demo --out runs/demo-verification --seed 43 --bootstrap 100
      - run: python scripts/check_rollback.py
      - run: counterlift export --run runs/demo --out runs/public-demo
