[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "counterlift"
version = "0.1.0"
description = "Reproducible randomized-experiment analysis and offline marketing policy evaluation"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
causal = ["econml>=0.16,<0.17"]

[project.scripts]
counterlift = "counterlift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
